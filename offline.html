<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | Lifeprep Academy Foundation</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.min.css?v=0d04aa625d">
  <style>
    body { display:grid; place-items:center; min-height:100vh; background:#f8f9fa; }
    .card { background:#fff; padding:2rem; border-radius:8px; box-shadow:0 2px 15px rgba(0,0,0,.08); max-width:520px; text-align:center; }
    h1 { margin-bottom: .5rem; }
    p { margin: .5rem 0; }
    .actions { margin-top: 1rem; display:flex; gap:.75rem; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>You're offline</h1>
    <p>It looks like you don’t have an internet connection. You can continue browsing any pages you’ve already opened.</p>
    <p>When you’re back online, reload this page to get the latest content.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/" rel="home">Go to Home</a>
      <button class="btn btn-secondary" onclick="location.reload()">Reload</button>
    </div>
  </main>
</body>
</html>
